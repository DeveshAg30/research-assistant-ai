# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Everything here is on the free plan; the React client is deployed
# separately on Vercel (see README).
services:
  # Python agent. The slim image (ONNX embeddings, no reranker, index built
  # into the image) fits the free plan's 512 MB. Free instances can't use
  # Render's private network, so it is public, but the research endpoint
  # requires AI_SERVICE_TOKEN.
  - type: web
    name: research-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile.slim
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Generated here; the server reads it via fromService below.
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: AGENT_TIMEOUT_S
        value: "110"

  # Express API, public. Free instances sleep after ~15 min idle
  # (first request afterwards takes ~1 min to wake).
  - type: web
    name: research-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      # research-ai's public URL, e.g. https://research-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "120000"
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: research-ai
          envVarKey: AI_SERVICE_TOKEN
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DAILY_QUERY_LIMIT
        value: "50"
      - key: DAILY_GLOBAL_QUERY_LIMIT
        value: "2000"
      - key: METRICS_TOKEN
        generateValue: true
      # The Vercel URL of the client, e.g. https://research-assistant.vercel.app
      - key: CLIENT_ORIGIN
        sync: false

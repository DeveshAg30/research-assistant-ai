# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Free setup: the React client is on Vercel and the Python AI service is a
# Hugging Face Space (see ai-service/README.md); only the Express server is here.
services:
  # Express API, public. Free instances sleep after ~15 min idle
  # (first request afterwards takes ~1 min to wake).
  - type: web
    name: research-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      # The Space URL, e.g. https://<hf-user>-research-ai.hf.space
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "120000"
      # Same value as the AI_SERVICE_TOKEN secret on the Space.
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DAILY_QUERY_LIMIT
        value: "50"
      - key: DAILY_GLOBAL_QUERY_LIMIT
        value: "2000"
      - key: METRICS_TOKEN
        generateValue: true
      # The Vercel URL of the client, e.g. https://research-assistant.vercel.app
      - key: CLIENT_ORIGIN
        sync: false

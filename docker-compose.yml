# Optional convenience compose file. The Python AI service builds a Chroma
# index at startup that can take a while and needs live internet access
# (Google/Tavily/HF/GitHub) -- for iterating on the agent itself, running it
# directly with `uvicorn` (see README) is usually faster than rebuilding
# this image on every change.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file: ./ai-service/.env
    environment:
      # Shared secret between server and ai-service (override in production).
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-dev-internal-token}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_factors_db

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/research_assistant
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-dev-internal-token}
      - CLIENT_ORIGIN=http://localhost:5173
    ports:
      # Host port 5001: on macOS, AirPlay Receiver already listens on 5000.
      - "5001:5000"
    depends_on:
      - mongo
      - ai-service

  client:
    build:
      context: ./client
      args:
        # Baked into the bundle at build time; set to your public API URL.
        - VITE_API_BASE_URL=http://localhost:5001/api
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
  chroma_data:

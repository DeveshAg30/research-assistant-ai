version: 2
updates:
  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    groups:
      langchain:
        patterns: ['langchain*']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
